[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "skrf_usimmics"
version = "0.1.0"
description = "CPW line designs with scikit-rf, with uSimmics schematic output"
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "pandas", "scikit-rf", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
